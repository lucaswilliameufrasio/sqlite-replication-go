name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        # https://github.com/actions/checkout/releases/tag/v7.0.1, checked 2026-11-09
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        # https://github.com/actions/setup-go/releases/tag/v7.0.0, checked 2026-11-09
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format, vet, build, and test
        run: |
          test -z "$(gofmt -l $(find . -type f -name '*.go'))"
          go vet ./...
          go build ./...
          go test -count=1 ./...
      - name: Test telemetry example
        working-directory: examples/coordinator-telemetry
        run: go test -race -count=3 ./...
      - name: Fuzz smoke tests
        run: |
          GOMAXPROCS=2 go test ./ltx -run '^$' -fuzz '^FuzzDecodeSnapshot$' -fuzztime=1s -parallel=2
          GOMAXPROCS=2 go test ./ltx -run '^$' -fuzz '^FuzzDecodeDelta$' -fuzztime=1s -parallel=2
          GOMAXPROCS=2 go test ./internal/wal -run '^$' -fuzz '^FuzzScan$' -fuzztime=1s -parallel=2
